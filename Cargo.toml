[workspace]
resolver = "3"
members = ["crates/kannada-morph", "crates/kannada-phonetic", "crates/kspell"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/openkannada/kannada-spell"
authors = ["Prasad Subrahmanya <prasadus92@gmail.com>"]

[workspace.dependencies]
kannada-morph = { path = "crates/kannada-morph" }
kannada-phonetic = { path = "crates/kannada-phonetic" }
unicode-normalization = "0.1.26"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
