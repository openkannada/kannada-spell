name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --locked

  hunspell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y hunspell libxml2-utils
      - run: scripts/hunspell-smoke.sh dict/kn_IN core
      - run: scripts/hunspell-smoke.sh dict/kn_IN,dict/kn_IN-wikipedia
      - run: cargo build --release --locked -p kspell
      - run: scripts/agreement.sh dict/kn_IN
      - run: scripts/agreement.sh dict/kn_IN,dict/kn_IN-wikipedia
      - run: scripts/package.sh && scripts/package-check.sh
      - name: Packages are the same under another umask
        run: sha256sum dist/* > ../packages.sha256 && (umask 077 && scripts/package.sh) && sha256sum -c ../packages.sha256

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx reuse@6.3.0 lint

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: .github/scripts/dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
